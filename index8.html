<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Favorite Book Genre</title>
        <link rel="stylesheet" href="assets/css/styles8.css">
        <link rel="stylesheet" href="assets/css/nav.css">
    </head>
    <body>

<nav class="page-nav">
  <a id="nav-prev" class="nav-arrow">&#8249;</a>
  <a href="index.html" class="nav-home" title="Home">
    <img src="assets/images/icon.webp" alt="Home">
  </a>
  <a id="nav-next" class="nav-arrow">&#8250;</a>
</nav>

<script>
  (function() {
    var pages  = ['index.html','index2.html','index3.html','index4.html','index5.html','index6.html','index7.html','index8.html','index9.html','index10.html'];
    var labels = ['Home','Stamp Collage','Book Recommendations','Books at a Glance','Bookstore Wheel','Book Crossword','Karen Kingsbury','Your Book Genre','Harry Potter World','Dr. Seuss'];
    var current = window.location.pathname.split('/').pop() || 'index.html';
    var idx = pages.indexOf(current);
    var prev = document.getElementById('nav-prev');
    var next = document.getElementById('nav-next');
    if (idx > 0) { prev.href = pages[idx-1]; prev.title = labels[idx-1]; }
    else prev.classList.add('nav-disabled');
    if (idx < pages.length-1) { next.href = pages[idx+1]; next.title = labels[idx+1]; }
    else next.classList.add('nav-disabled');
  })();
</script>

        <div class="genre-page">
            <h1>What is your favorite book genre?</h1>
            <form id="genre-form">
                <label for="genre-select">Choose one:</label>
                <select id="genre-select" name="genre" required>
                    <option value="" selected disabled>-- Select a genre --</option>
                    <option value="romance.html">Romance</option>
                    <option value="mystery.html">Mystery</option>
                    <option value="history.html">History</option>
                    <option value="fiction.html">Fiction</option>
                </select>
                <button type="submit">Submit</button>
            </form>
        </div>

        <script>
            document.getElementById('genre-form').addEventListener('submit', function (event) {
                event.preventDefault();
                const select = document.getElementById('genre-select');
                const target = select.value;
                if (target) {
                    window.location.href = target;
                }
            });
        </script>
    </body>
</html>
