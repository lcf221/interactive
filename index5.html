<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reading Video</title>
    <link rel="stylesheet" href="styles5.css">
</head>
<body>

<div class="container">

    <!-- VIDEO ON LEFT -->
    <div class="video-wrapper">
        <video id="readingVideo" src="assets/videos/reading.mp4" controls autoplay muted loop></video>
    </div>

    <!-- HOURGLASS ON RIGHT -->
    <div class="hourglass-wrapper">
        <div class="hourglass">
            <div class="sand top"></div>
            <div class="sand bottom"></div>
            <div class="glass"></div>
        </div>
    </div>

</div>

</body>
</html>
