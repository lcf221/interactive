<!DOCTYPE html>

<title>Responsive Bookshelf</title>

<link rel="stylesheet" href="assets/css/nav.css">
<style>
  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    align-items: flex-end; /* keep shelf at bottom */
    justify-content: center;
    overflow: hidden;
    position: relative;
    font-family: Arial, sans-serif;
    background-color: #FFF3D7;
  }

  @keyframes shelfFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .bookshelf {
    display: flex;
    align-items: flex-end;
    width: 100%;
    animation: shelfFadeIn 0.35s ease forwards;
  }

  .bookshelf img {
    height: auto;
    width: auto;
    max-height: 85vh;
    display: block;
    transition: transform 0.3s, filter 0.3s;
  }

  /* Hover effect for all books */
  .bookshelf img:hover {
    transform: translateY(-10px) scale(1.05);
    filter: brightness(1.2);
  }

  /* Extra glow for clickable books */
  .bookshelf img[data-link]:hover {
    filter: brightness(1.4);
    cursor: pointer;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 900px) {
    body {
      overflow-x: auto;
      overflow-y: hidden;
      align-items: flex-end;
    }
    .bookshelf img {
      max-width: 7vw;
      height: auto;
    }
  }

  @media (max-width: 480px) {
    .bookshelf img {
      max-width: 10vw;
      height: auto;
    }
  }

</style>
</head>

<script>
  (function() {
    var pages  = ['index.html','index2.html','index3.html','index4.html','index5.html','index6.html','index7.html','index8.html','index9.html','index10.html'];
    var labels = ['Home','Stamp Collage','Book Recommendations','Books at a Glance','Bookstore Wheel','Book Crossword','Karen Kingsbury','Your Book Genre','Harry Potter World','Dr. Seuss'];
    var current = window.location.pathname.split('/').pop() || 'index.html';
    var idx = pages.indexOf(current);
    var prev = document.getElementById('nav-prev');
    var next = document.getElementById('nav-next');
    if (idx > 0) { prev.href = pages[idx-1]; prev.title = labels[idx-1]; }
    else prev.classList.add('nav-disabled');
    if (idx < pages.length-1) { next.href = pages[idx+1]; next.title = labels[idx+1]; }
    else next.classList.add('nav-disabled');
  })();
</script>

<script>
  function scaleBooks() {
    const shelf = document.getElementById("bookshelf");
    const books = shelf.querySelectorAll("img");
    let totalNaturalWidth = 0;
    books.forEach(img => { totalNaturalWidth += img.naturalWidth; });
    const scale = shelf.clientWidth / totalNaturalWidth;
    books.forEach(img => { img.style.width = (img.naturalWidth * scale) + "px"; });
  }

  window.addEventListener("load", scaleBooks);
  window.addEventListener("resize", scaleBooks);

  document.querySelectorAll('.bookshelf img[data-link]').forEach(img => {
    img.addEventListener('click', () => {
      window.location.href = img.dataset.link;
    });
  });
</script>
